<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR-VENDAS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

nav {
    display: flex;
    overflow-x: auto;
    background: #1f2937;
}

nav button {
    flex: 1;
    min-width: 100px;
    padding: 14px 8px;
    border: 0;
    background: #1f2937;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

nav button:hover {
    background: #374151;
}

section {
    display: none;
    padding: 18px;
    max-width: 1000px;
    margin: auto;
}

section.active {
    display: block;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

input, button, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

button {
    background: #111827;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.btn-verde {
    background: #16a34a;
}

.btn-vermelho {
    background: #dc2626;
}

.btn-azul {
    background: #2563eb;
}

.btn-cinza {
    background: #6b7280;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.dashboard {
    text-align: center;
    font-size: 18px;
}

.dashboard strong {
    display: block;
    font-size: 30px;
    margin-top: 8px;
}

.produto {
    border: 1px solid #ddd;
    padding: 14px;
    border-radius: 10px;
    margin-top: 10px;
}

.produto h3 {
    margin: 0 0 6px;
}

.produto p {
    margin: 5px 0;
}

.acoes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.item-carrinho {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.total {
    font-size: 24px;
    font-weight: bold;
    text-align: right;
    margin-top: 15px;
}

#scanner {
    width: 100%;
    max-height: 300px;
    background: #000;
    border-radius: 10px;
    display: none;
    margin-top: 10px;
}

.aviso {
    padding: 12px;
    border-radius: 8px;
    background: #fef3c7;
    color: #92400e;
    margin-bottom: 12px;
}

.sucesso {
    padding: 12px;
    border-radius: 8px;
    background: #dcfce7;
    color: #166534;
    margin-bottom: 12px;
}

.erro {
    padding: 12px;
    border-radius: 8px;
    background: #fee2e2;
    color: #991b1b;
    margin-bottom: 12px;
}

.pequeno {
    font-size: 14px;
    color: #6b7280;
}

@media (max-width: 600px) {
    section {
        padding: 12px;
    }

    nav button {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>
    <h1>JR-VENDAS</h1>
    <div class="pequeno" style="color:white;">
        Sistema de vendas e estoque
    </div>
</header>

<nav>
    <button onclick="mostrarSecao('inicio')">Início</button>
    <button onclick="mostrarSecao('produtos')">Produtos</button>
    <button onclick="mostrarSecao('venda')">Venda</button>
    <button onclick="mostrarSecao('historico')">Histórico</button>
</nav>

<section id="inicio" class="active">

    <div class="card">
        <h2>Dashboard</h2>

        <div class="grid">

            <div class="card dashboard">
                Produtos
                <strong id="totalProdutos">0</strong>
            </div>

            <div class="card dashboard">
                Estoque
                <strong id="totalEstoque">0</strong>
            </div>

            <div class="card dashboard">
                Vendas
                <strong id="quantidadeVendas">0</strong>
            </div>

            <div class="card dashboard">
                Total vendido
                <strong id="totalVendas">R$ 0,00</strong>
            </div>

        </div>
    </div>

    <div id="mensagemInicio"></div>

</section>


<section id="produtos">

    <div class="card">

        <h2>Cadastrar produto</h2>

        <input
            type="text"
            id="nomeProduto"
            placeholder="Nome do produto"
        >

        <input
            type="text"
            id="codigoProduto"
            placeholder="Código / código de barras"
        >

        <input
            type="number"
            id="precoProduto"
            placeholder="Preço"
            step="0.01"
        >

        <input
            type="number"
            id="estoqueProduto"
            placeholder="Quantidade em estoque"
            min="0"
        >

        <button class="btn-verde" onclick="cadastrarProduto()">
            Cadastrar produto
        </button>

        <button class="btn-azul" onclick="abrirScanner()">
            📷 Ler código de barras
        </button>

        <video id="scanner" autoplay playsinline></video>

        <button
            id="fecharScanner"
            class="btn-vermelho"
            style="display:none"
            onclick="fecharScanner()"
        >
            Fechar câmera
        </button>

    </div>

    <div class="card">

        <h2>Produtos cadastrados</h2>

        <input
            type="text"
            id="buscaProduto"
            placeholder="Pesquisar produto..."
            oninput="renderizarProdutos()"
        >

        <div id="listaProdutos">
            Carregando produtos...
        </div>

    </div>

</section>


<section id="venda">

    <div class="card">

        <h2>Nova venda</h2>

        <input
            type="text"
            id="buscaVenda"
            placeholder="Pesquisar produto para vender..."
            oninput="renderizarProdutosVenda()"
        >

        <div id="produtosVenda"></div>

    </div>

    <div class="card">

        <h2>Carrinho</h2>

        <div id="carrinho">
            Carrinho vazio.
        </div>

        <div class="total">
            Total: <span id="totalCarrinho">R$ 0,00</span>
        </div>

        <button
            class="btn-verde"
            onclick="finalizarVenda()"
        >
            Finalizar venda
        </button>

    </div>

</section>


<section id="historico">

    <div class="card">

        <h2>Histórico de vendas</h2>

        <div id="listaHistorico">
            Carregando histórico...
        </div>

    </div>

</section>


<script>

// =====================================================
// CONFIGURAÇÃO DO SUPABASE
// =====================================================

const SUPABASE_URL = "https://etepqitfbgjeuionyxcs.supabase.co";

const SUPABASE_KEY = "sb_publishable_Sc_FDF2vBPEDJy9t16sS0A_z4aoZKQc";

const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// VARIÁVEIS
// =====================================================

let produtos = [];
let vendas = [];
let carrinho = [];

let streamCamera = null;


// =====================================================
// INICIALIZAÇÃO
// =====================================================

document.addEventListener("DOMContentLoaded", async () => {

    await carregarProdutos();
    await carregarVendas();

    atualizarDashboard();
    renderizarProdutos();
    renderizarProdutosVenda();
    renderizarHistorico();

});


// =====================================================
// NAVEGAÇÃO
// =====================================================

function mostrarSecao(nome) {

    document.querySelectorAll("section").forEach(secao => {
        secao.classList.remove("active");
    });

    document.getElementById(nome).classList.add("active");

    if (nome === "produtos") {
        renderizarProdutos();
    }

    if (nome === "venda") {
        renderizarProdutosVenda();
    }

    if (nome === "historico") {
        renderizarHistorico();
    }

    atualizarDashboard();
}


// =====================================================
// MENSAGENS
// =====================================================

function mostrarMensagem(texto, tipo = "sucesso") {

    const elemento = document.getElementById("mensagemInicio");

    elemento.innerHTML = `
        <div class="${tipo}">
            ${texto}
        </div>
    `;

    setTimeout(() => {
        elemento.innerHTML = "";
    }, 4000);
}


// =====================================================
// PRODUTOS - SUPABASE
// =====================================================

async function carregarProdutos() {

    const { data, error } = await sb
        .from("produtos")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

        console.error(error);

        mostrarMensagem(
            "Erro ao carregar produtos: " + error.message,
            "erro"
        );

        return;
    }

    produtos = data || [];
}


// =====================================================
// CADASTRAR PRODUTO
// =====================================================

async function cadastrarProduto() {

    const nome = document
        .getElementById("nomeProduto")
        .value
        .trim();

    const codigo = document
        .getElementById("codigoProduto")
        .value
        .trim();

    const preco = parseFloat(
        document.getElementById("precoProduto").value
    );

    const estoque = parseInt(
        document.getElementById("estoqueProduto").value
    );


    if (!nome) {
        alert("Digite o nome do produto.");
        return;
    }

    if (isNaN(preco) || preco < 0) {
        alert("Digite um preço válido.");
        return;
    }

    if (isNaN(estoque) || estoque < 0) {
        alert("Digite um estoque válido.");
        return;
    }


    const { data, error } = await sb
        .from("produtos")
        .insert([
            {
                nome: nome,
                codigo: codigo || null,
                preco: preco,
                estoque: estoque
            }
        ])
        .select()
        .single();


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar produto:\n" +
            error.message
        );

        return;
    }


    produtos.unshift(data);

    document.getElementById("nomeProduto").value = "";
    document.getElementById("codigoProduto").value = "";
    document.getElementById("precoProduto").value = "";
    document.getElementById("estoqueProduto").value = "";


    renderizarProdutos();
    renderizarProdutosVenda();
    atualizarDashboard();

    mostrarMensagem("Produto cadastrado com sucesso!");

}


// =====================================================
// RENDERIZAR PRODUTOS
// =====================================================

function renderizarProdutos() {

    const lista = document.getElementById("listaProdutos");

    const busca = document
        .getElementById("buscaProduto")
        .value
        .toLowerCase()
        .trim();


    const filtrados = produtos.filter(produto => {

        return (
            produto.nome.toLowerCase().includes(busca) ||
            (produto.codigo || "")
                .toLowerCase()
                .includes(busca)
        );

    });


    if (filtrados.length === 0) {

        lista.innerHTML = `
            <div class="aviso">
                Nenhum produto encontrado.
            </div>
        `;

        return;
    }


    lista.innerHTML = filtrados.map(produto => `

        <div class="produto">

            <h3>${escaparHTML(produto.nome)}</h3>

            <p>
                Código:
                ${escaparHTML(produto.codigo || "Sem código")}
            </p>

            <p>
                Preço:
                <strong>${formatarMoeda(produto.preco)}</strong>
            </p>

            <p>
                Estoque:
                <strong>${produto.estoque}</strong>
            </p>

            <div class="acoes">

                <button
                    class="btn-azul"
                    onclick="alterarEstoque(${produto.id})"
                >
                    Alterar estoque
                </button>

                <button
                    class="btn-vermelho"
                    onclick="excluirProduto(${produto.id})"
                >
                    Excluir
                </button>

            </div>

        </div>

    `).join("");

}


// =====================================================
// ALTERAR ESTOQUE
// =====================================================

async function alterarEstoque(id) {

    const produto = produtos.find(p => p.id === id);

    if (!produto) return;


    const novoEstoque = prompt(
        "Novo estoque para " + produto.nome + ":",
        produto.estoque
    );


    if (novoEstoque === null) return;


    const valor = parseInt(novoEstoque);


    if (isNaN(valor) || valor < 0) {

        alert("Digite uma quantidade válida.");

        return;
    }


    const { error } = await sb
        .from("produtos")
        .update({
            estoque: valor
        })
        .eq("id", id);


    if (error) {

        alert(
            "Erro ao alterar estoque:\n" +
            error.message
        );

        return;
    }


    produto.estoque = valor;


    renderizarProdutos();
    renderizarProdutosVenda();
    atualizarDashboard();

}


// =====================================================
// EXCLUIR PRODUTO
// =====================================================

async function excluirProduto(id) {

    const produto = produtos.find(p => p.id === id);

    if (!produto) return;


    const confirmar = confirm(
        "Excluir o produto " +
        produto.nome +
        "?"
    );


    if (!confirmar) return;


    const { error } = await sb
        .from("produtos")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Erro ao excluir produto:\n" +
            error.message
        );

        return;
    }


    produtos = produtos.filter(
        p => p.id !== id
    );


    carrinho = carrinho.filter(
        item => item.id !== id
    );


    renderizarProdutos();
    renderizarProdutosVenda();
    renderizarCarrinho();
    atualizarDashboard();


    mostrarMensagem("Produto excluído.");

}


// =====================================================
// PRODUTOS PARA VENDA
// =====================================================

function renderizarProdutosVenda() {

    const lista = document.getElementById("produtosVenda");

    const campo = document.getElementById("buscaVenda");

    const busca = campo
        ? campo.value.toLowerCase().trim()
        : "";


    const filtrados = produtos.filter(produto => {

        return (
            produto.nome.toLowerCase().includes(busca) ||
            (produto.codigo || "")
                .toLowerCase()
                .includes(busca)
        );

    });


    if (filtrados.length === 0) {

        lista.innerHTML = `
            <div class="aviso">
                Nenhum produto encontrado.
            </div>
        `;

        return;
    }


    lista.innerHTML = filtrados.map(produto => `

        <div class="produto">

            <h3>${escaparHTML(produto.nome)}</h3>

            <p>
                ${formatarMoeda(produto.preco)}
            </p>

            <p>
                Estoque disponível:
                <strong>${produto.estoque}</strong>
            </p>

            <button
                class="btn-azul"
                onclick="adicionarCarrinho(${produto.id})"
                ${produto.estoque <= 0 ? "disabled" : ""}
            >
                Adicionar à venda
            </button>

        </div>

    `).join("");

}


// =====================================================
// CARRINHO
// =====================================================

function adicionarCarrinho(id) {

    const produto = produtos.find(p => p.id === id);

    if (!produto) return;


    if (produto.estoque <= 0) {

        alert("Produto sem estoque.");

        return;
    }


    const existente = carrinho.find(
        item => item.id === id
    );


    if (existente) {

        if (existente.quantidade >= produto.estoque) {

            alert("Quantidade maior que o estoque disponível.");

            return;
        }

        existente.quantidade++;

    } else {

        carrinho.push({
            id: produto.id,
            nome: produto.nome,
            preco: Number(produto.preco),
            quantidade: 1
        });

    }


    renderizarCarrinho();

}


function alterarQuantidadeCarrinho(id, delta) {

    const item = carrinho.find(
        produto => produto.id === id
    );

    if (!item) return;


    const produto = produtos.find(
        produto => produto.id === id
    );

    if (!produto) return;


    item.quantidade += delta;


    if (item.quantidade <= 0) {

        carrinho = carrinho.filter(
            produto => produto.id !== id
        );

    } else if (item.quantidade > produto.estoque) {

        item.quantidade = produto.estoque;

        alert("Quantidade limitada ao estoque disponível.");

    }


    renderizarCarrinho();

}


function removerCarrinho(id) {

    carrinho = carrinho.filter(
        item => item.id !== id
    );

    renderizarCarrinho();

}


function calcularTotalCarrinho() {

    return carrinho.reduce(
        (total, item) =>
            total + (item.preco * item.quantidade),
        0
    );

}


function renderizarCarrinho() {

    const elemento = document.getElementById("carrinho");

    const totalElemento =
        document.getElementById("totalCarrinho");


    if (carrinho.length === 0) {

        elemento.innerHTML = "Carrinho vazio.";

        totalElemento.innerText = "R$ 0,00";

        return;
    }


    elemento.innerHTML = carrinho.map(item => `

        <div class="item-carrinho">

            <strong>
                ${escaparHTML(item.nome)}
            </strong>

            <br>

            ${formatarMoeda(item.preco)}
            ×
            ${item.quantidade}

            <div class="acoes">

                <button
                    class="btn-azul"
                    onclick="alterarQuantidadeCarrinho(${item.id}, 1)"
                >
                    +
                </button>

                <button
                    class="btn-cinza"
                    onclick="alterarQuantidadeCarrinho(${item.id}, -1)"
                >
                    -
                </button>

            </div>

            <button
                class="btn-vermelho"
                onclick="removerCarrinho(${item.id})"
            >
                Remover
            </button>

        </div>

    `).join("");


    totalElemento.innerText =
        formatarMoeda(
            calcularTotalCarrinho()
        );

}


// =====================================================
// FINALIZAR VENDA
// =====================================================

async function finalizarVenda() {

    if (carrinho.length === 0) {

        alert("O carrinho está vazio.");

        return;
    }


    const confirmar = confirm(
        "Finalizar venda no valor de " +
        formatarMoeda(calcularTotalCarrinho()) +
        "?"
    );


    if (!confirmar) return;


    // Conferir estoque novamente antes de vender

    await carregarProdutos();


    for (const item of carrinho) {

        const produto = produtos.find(
            p => p.id === item.id
        );


        if (!produto) {

            alert(
                "O produto " +
                item.nome +
                " não foi encontrado."
            );

            return;
        }


        if (produto.estoque < item.quantidade) {

            alert(
                "Estoque insuficiente para " +
                item.nome
            );

            return;
        }

    }


    // Baixar estoque

    for (const item of carrinho) {

        const produto = produtos.find(
            p => p.id === item.id
        );


        const novoEstoque =
            produto.estoque - item.quantidade;


        const { error } = await sb
            .from("produtos")
            .update({
                estoque: novoEstoque
            })
            .eq("id", produto.id);


        if (error) {

            alert(
                "Erro ao atualizar estoque:\n" +
                error.message
            );

            await carregarProdutos();

            return;
        }

    }


    const total = calcularTotalCarrinho();


    const { error: erroVenda } = await sb
        .from("vendas")
        .insert([
            {
                itens: carrinho,
                total: total
            }
        ]);


    if (erroVenda) {

        alert(
            "O estoque foi atualizado, mas houve erro ao registrar a venda:\n" +
            erroVenda.message
        );

        await carregarProdutos();

        return;
    }


    carrinho = [];


    await carregarProdutos();
    await carregarVendas();


    renderizarCarrinho();
    renderizarProdutos();
    renderizarProdutosVenda();
    renderizarHistorico();
    atualizarDashboard();


    mostrarMensagem(
        "Venda finalizada com sucesso!"
    );

}


// =====================================================
// VENDAS - SUPABASE
// =====================================================

async function carregarVendas() {

    const { data, error } = await sb
        .from("vendas")
        .select("*")
        .order("id", { ascending: false });


    if (error) {

        console.error(error);

        mostrarMensagem(
            "Erro ao carregar vendas: " +
            error.message,
            "erro"
        );

        return;
    }


    vendas = data || [];

}


// =====================================================
// HISTÓRICO
// =====================================================

function renderizarHistorico() {

    const lista =
        document.getElementById("listaHistorico");


    if (vendas.length === 0) {

        lista.innerHTML = `
            <div class="aviso">
                Nenhuma venda registrada ainda.
            </div>
        `;

        return;
    }


    lista.innerHTML = vendas.map(venda => {

        let itens = [];

        try {
            itens = Array.isArray(venda.itens)
                ? venda.itens
                : [];
        } catch (e) {
            itens = [];
        }


        const textoItens = itens.map(item => {

            return `
                ${escaparHTML(item.nome)}
                × ${item.quantidade}
            `;

        }).join("<br>");


        return `

            <div class="produto">

                <h3>
                    Venda #${venda.id}
                </h3>

                <p>
                    Data:
                    ${formatarData(venda.data)}
                </p>

                <p>
                    ${textoItens}
                </p>

                <p>
                    Total:
                    <strong>
                        ${formatarMoeda(venda.total)}
                    </strong>
                </p>

            </div>

        `;

    }).join("");

}


// =====================================================
// DASHBOARD
// =====================================================

function atualizarDashboard() {

    const totalProdutos =
        produtos.length;


    const totalEstoque =
        produtos.reduce(
            (total, produto) =>
                total + Number(produto.estoque || 0),
            0
        );


    const totalVendas =
        vendas.reduce(
            (total, venda) =>
                total + Number(venda.total || 0),
            0
        );


    document.getElementById(
        "totalProdutos"
    ).innerText = totalProdutos;


    document.getElementById(
        "totalEstoque"
    ).innerText = totalEstoque;


    document.getElementById(
        "quantidadeVendas"
    ).innerText = vendas.length;


    document.getElementById(
        "totalVendas"
    ).innerText = formatarMoeda(totalVendas);

}


// =====================================================
// CÓDIGO DE BARRAS
// =====================================================

async function abrirScanner() {

    const video =
        document.getElementById("scanner");

    const fechar =
        document.getElementById("fecharScanner");


    if (!("BarcodeDetector" in window)) {

        alert(
            "Seu navegador não oferece suporte ao leitor automático de código de barras."
        );

        return;
    }


    try {

        streamCamera =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment"
                }
            });


        video.srcObject = streamCamera;

        video.style.display = "block";

        fechar.style.display = "block";


        const detector =
            new BarcodeDetector();


        const procurarCodigo = async () => {

            if (!streamCamera) return;


            try {

                const codigos =
                    await detector.detect(video);


                if (codigos.length > 0) {

                    const codigo =
                        codigos[0].rawValue;


                    document.getElementById(
                        "codigoProduto"
                    ).value = codigo;


                    fecharScanner();

                    return;
                }

            } catch (erro) {

                console.error(erro);

            }


            if (streamCamera) {

                requestAnimationFrame(
                    procurarCodigo
                );

            }

        };


        procurarCodigo();


    } catch (erro) {

        alert(
            "Não foi possível abrir a câmera."
        );

        console.error(erro);

    }

}


function fecharScanner() {

    const video =
        document.getElementById("scanner");

    const fechar =
        document.getElementById("fecharScanner");


    if (streamCamera) {

        streamCamera
            .getTracks()
            .forEach(track => track.stop());

        streamCamera = null;

    }


    video.srcObject = null;

    video.style.display = "none";

    fechar.style.display = "none";

}


// =====================================================
// FUNÇÕES AUXILIARES
// =====================================================

function formatarMoeda(valor) {

    return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


function formatarData(data) {

    if (!data) return "-";


    return new Date(data).toLocaleString(
        "pt-BR"
    );

}


function escaparHTML(texto) {

    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}
